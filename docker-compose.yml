services:
  postgres:
    # Using 'latest' for convenience in local dev; pin a version (e.g., 17-alpine) for reproducibility.
    image: postgres:latest
    container_name: satisfactory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: satisfactory
      # Optional: tune for local dev (can be removed in prod)
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Hardcode values to avoid docker compose variable substitution warnings
      test: ["CMD-SHELL", "pg_isready -d satisfactory -U app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # If you want to limit resources locally (optional)
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M

  postgres-test:
    # Test database for running automated tests
    image: postgres:latest
    container_name: satisfactory-postgres-test
    restart: "no"  # Don't restart automatically - only for testing
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: satisfactory_test
      # Optimized settings for testing
      POSTGRES_INITDB_ARGS: "--auth-host=trust --auth-local=trust"
    ports:
      - "5433:5432"
    # Use tmpfs for faster test execution (data is not persisted)
    tmpfs:
      - /var/lib/postgresql/data:noexec,nosuid,size=512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d satisfactory_test -U app"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # Optimized for testing - less memory usage
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: satisfactory-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False' # allow multiple user sessions if needed
    ports:
      - "8081:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./config/pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  postgres-data:
  pgadmin-data:

# Usage:
#   docker compose up -d postgres pgadmin          # Development database + pgAdmin
#   docker compose up -d postgres-test            # Test database only
#   docker compose up -d postgres postgres-test   # Both databases
# 
# Connection strings:
#   Development: postgres://app:app@localhost:5432/satisfactory
#   Testing:     postgres://app:app@localhost:5433/satisfactory_test
# 
# pgAdmin URL:
#   http://localhost:8081  (login with admin@example.com / admin)
