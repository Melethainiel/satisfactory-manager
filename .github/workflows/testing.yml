name: Testing Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'SatisfactoryManager.SvelteKit/**'
      - '.github/workflows/testing.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'SatisfactoryManager.SvelteKit/**'
      - '.github/workflows/testing.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # API Integration Tests
  api-integration-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SatisfactoryManager.SvelteKit
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: satisfactory_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: SatisfactoryManager.SvelteKit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup test environment
        run: |
          cat > .env << 'EOF'
          DATABASE_URL="postgres://app:app@localhost:5432/satisfactory_test?sslmode=disable"
          TEST_DATABASE_URL="postgres://app:app@localhost:5432/satisfactory_test?sslmode=disable"
          NODE_ENV="test"

          AZURE_B2C_CLIENT_ID="00000000-0000-0000-0000-000000000000"
          AZURE_B2C_AUTHORITY="https://test.b2clogin.com/test.onmicrosoft.com/B2C_1_TEST"
          AZURE_B2C_KNOWN_AUTHORITIES='["test.b2clogin.com"]'
          AZURE_B2C_TENANT_ID="00000000-0000-0000-0000-000000000000"

          PUBLIC_AZURE_B2C_CLIENT_ID="00000000-0000-0000-0000-000000000000"
          PUBLIC_AZURE_B2C_AUTHORITY="https://test.b2clogin.com/test.onmicrosoft.com/B2C_1_TEST"
          PUBLIC_AZURE_B2C_KNOWN_AUTHORITIES='["test.b2clogin.com"]'

          EOF

      - name: Run database migrations
        run: npm run db:migrate

      - name: Run API integration tests
        run: npm run test:integration

  # Code Quality Checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SatisfactoryManager.SvelteKit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: SatisfactoryManager.SvelteKit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Run TypeScript check
        run: npm run check

  # Test Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [api-integration-tests, code-quality]
    if: always()

    steps:
      - name: Test Results Summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| API Integration Tests | ${{ needs.api-integration-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Set overall status
          if [ "${{ needs.api-integration-tests.result }}" = "success" ] && 
             [ "${{ needs.code-quality.result }}" = "success" ]; then
            echo "### ✅ All tests passed successfully!" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "### ❌ Some tests failed. Please review the results above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi