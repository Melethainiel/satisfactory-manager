services:
  # PostgreSQL - Main Database
  postgres:
    image: postgres:17-alpine
    container_name: satisfactory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: satisfactory
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d satisfactory -U app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # PostgreSQL - Test Database
  postgres-test:
    image: postgres:17-alpine
    container_name: satisfactory-postgres-test
    restart: "no"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: satisfactory_test
      POSTGRES_INITDB_ARGS: "--auth-host=trust --auth-local=trust"
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data:noexec,nosuid,size=512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d satisfactory_test -U app"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # pgAdmin - Database Management UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: satisfactory-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8081:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  # SvelteKit Application (Production build)
  app:
    build:
      context: ./SatisfactoryManager.SvelteKit
      dockerfile: Dockerfile
    container_name: satisfactory-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://app:app@postgres:5432/satisfactory
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # SvelteKit Dev Server (Hot Reload)
  app-dev:
    build:
      context: ./SatisfactoryManager.SvelteKit
      dockerfile: Dockerfile.dev
    container_name: satisfactory-app-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://app:app@postgres:5432/satisfactory
      PORT: 5173
    ports:
      - "5173:5173"
    volumes:
      - ./SatisfactoryManager.SvelteKit:/app
      - /app/node_modules
      - /app/.svelte-kit
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres-data:
  pgadmin-data:

networks:
  app-network:
    driver: bridge

# Usage:
#   docker compose up -d postgres pgadmin              # Start databases only
#   docker compose up -d app                           # Start app with production build
#   docker compose up -d app-dev                        # Start app with dev server (hot reload)
#   docker compose up -d postgres-test                # Start test database
#   docker compose up -d postgres app-dev              # Start database + dev app (recommended for dev)
#
# Connection strings:
#   Development:  postgres://app:app@localhost:5432/satisfactory
#   Testing:      postgres://app:app@localhost:5433/satisfactory_test
#
# URLs:
#   Dev App:      http://localhost:5173
#   Prod App:     http://localhost:3000
#   pgAdmin:      http://localhost:8081 (login: admin@example.com / admin)
