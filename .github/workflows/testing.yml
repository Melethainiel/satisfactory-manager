name: Testing Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'SatisfactoryManager.SvelteKit/**'
      - '.github/workflows/testing.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'SatisfactoryManager.SvelteKit/**'
      - '.github/workflows/testing.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # Unit and Component Tests
  unit-tests:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SatisfactoryManager.SvelteKit
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: satisfactory_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: SatisfactoryManager.SvelteKit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup test environment
        run: |
          cat > .env << 'EOF'
          DATABASE_URL="postgres://app:app@localhost:5432/satisfactory_test"
          TEST_DATABASE_URL="postgres://app:app@localhost:5432/satisfactory_test"
          NODE_ENV="test"
          EOF

      - name: Run database migrations
        run: npm run db:migrate

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./SatisfactoryManager.SvelteKit/coverage/lcov.info
          flags: unit-tests
          name: unit-tests-coverage

  # Component Tests (separate job for parallel execution)
  component-tests:
    name: Component Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SatisfactoryManager.SvelteKit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: SatisfactoryManager.SvelteKit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run component tests
        run: npm run test:components

  # End-to-End Tests
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SatisfactoryManager.SvelteKit
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: satisfactory_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: SatisfactoryManager.SvelteKit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Setup test environment
        run: |
          cat > .env << 'EOF'
          DATABASE_URL="postgres://app:app@localhost:5432/satisfactory_test"
          TEST_DATABASE_URL="postgres://app:app@localhost:5432/satisfactory_test"
          TEST_BASE_URL="http://localhost:5173"
          TEST_USE_REAL_AZURE_B2C="false"
          NODE_ENV="test"
          EOF

      - name: Run database migrations
        run: npm run db:migrate

      - name: Build application
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: SatisfactoryManager.SvelteKit/playwright-report/
          retention-days: 30

  # Accessibility Tests
  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SatisfactoryManager.SvelteKit
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: satisfactory_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: SatisfactoryManager.SvelteKit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Setup test environment
        run: |
          cat > .env << 'EOF'
          DATABASE_URL="postgres://app:app@localhost:5432/satisfactory_test"
          TEST_DATABASE_URL="postgres://app:app@localhost:5432/satisfactory_test"
          TEST_BASE_URL="http://localhost:5173"
          TEST_USE_REAL_AZURE_B2C="false"
          NODE_ENV="test"
          EOF

      - name: Run database migrations
        run: npm run db:migrate

      - name: Build application
        run: npm run build

      - name: Run accessibility tests
        run: npm run test:e2e:accessibility

      - name: Upload accessibility test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: SatisfactoryManager.SvelteKit/playwright-report/
          retention-days: 30

  # Code Quality Checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SatisfactoryManager.SvelteKit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: SatisfactoryManager.SvelteKit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Run TypeScript check
        run: npm run check

  # Test Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, component-tests, e2e-tests, accessibility-tests, code-quality]
    if: always()

    steps:
      - name: Test Results Summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Component Tests | ${{ needs.component-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Accessibility Tests | ${{ needs.accessibility-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Set overall status
          if [ "${{ needs.unit-tests.result }}" = "success" ] && 
             [ "${{ needs.component-tests.result }}" = "success" ] && 
             [ "${{ needs.e2e-tests.result }}" = "success" ] && 
             [ "${{ needs.accessibility-tests.result }}" = "success" ] && 
             [ "${{ needs.code-quality.result }}" = "success" ]; then
            echo "### ✅ All tests passed successfully!" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "### ❌ Some tests failed. Please review the results above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi